name: Release

# Push a tag equal to the version in manifest.json (e.g. `0.3.0`, no "v" prefix) to create a
# draft GitHub release with the three files Obsidian installs: main.js, manifest.json, styles.css.
# Release notes come from the matching section of CHANGELOG.md; the assets get build provenance
# attestations.

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install
        run: npm ci

      - name: Check that the tag matches manifest.json
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest.json version $version" >&2
            exit 1
          fi

      - name: Lint and test
        run: |
          npm run lint
          npm test

      - name: Build
        run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Release notes from CHANGELOG.md
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          awk -v v="## $tag" '$0 == v { found = 1; next } /^## / && found { exit } found' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $tag" >&2
            exit 1
          fi
          cat release-notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --notes-file=release-notes.md \
            --draft \
            main.js manifest.json styles.css
