name: Release

# Push a tag equal to the version in manifest.json (e.g. `0.1.0`, no "v" prefix) to create a
# draft GitHub release with the three files Obsidian installs: main.js, manifest.json, styles.css.

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install
        run: npm ci

      - name: Check that the tag matches manifest.json
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest.json version $version" >&2
            exit 1
          fi

      - name: Lint and test
        run: |
          npm run lint
          npm test

      - name: Build
        run: npm run build

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json styles.css
